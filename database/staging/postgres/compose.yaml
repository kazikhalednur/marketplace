services:
  db:
    build:
      context: .
    image: marketplace-staging-postgres
    container_name: marketplace-staging-db
    restart: always
    volumes:
      - staging-db-data:/var/lib/postgresql/18/docker
      - staging-db-backups:/backups
    expose:
      - 5432
    env_file:
      - .env
    networks:
      - staging-backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  staging-backend:
    external: true

volumes:
  staging-db-data:
  staging-db-backups:
