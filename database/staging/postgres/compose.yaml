services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: staging-marketplace-postgres
    container_name: staging-marketplace-db
    restart: unless-stopped
    volumes:
      - staging-db-data:/var/lib/postgresql/18/docker
      - staging-db-backups:/backups
    env_file:
      - .env
    networks:
      - staging-marketplace-database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

networks:
  staging-marketplace-database:
    external: true

volumes:
  staging-db-data:
  staging-db-backups:
