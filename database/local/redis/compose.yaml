services:
  redis:
    image: redis:7.4
    container_name: local-marketplace-redis
    restart: always
    env_file:
      - .env
    expose:
      - ${REDIS_PORT}
    volumes:
      - ${REDIS_PATH}:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
      --activedefrag yes
    networks:
      - local-marketplace-database
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  local-marketplace-database:
    external: true
