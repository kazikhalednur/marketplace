services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-marketplace-db
    container_name: local-marketplace-db
    restart: unless-stopped
    volumes:
      - ${POSTGRES_PATH}:/var/lib/postgresql
    env_file:
      - .env
    expose:
      - 5432
    networks:
      - local-marketplace-database
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  local-marketplace-database:
    external: true
