services:
  client:
    build:
      context: .
      dockerfile: compose/local/Dockerfile
    image: local-marketplace-client
    container_name: local-marketplace-client
    restart: unless-stopped
    env_file:
      - compose/local/.env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - 3000:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - local-marketplace
      - local-marketplace-backend

networks:
  local-marketplace:
    external: true
  local-marketplace-backend:
    external: true
