services:
  client:
    build:
      context: .
      dockerfile: compose/local/Dockerfile
    image: marketplace-client
    container_name: marketplace-client
    restart: unless-stopped
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
    env_file:
      - compose/local/.env
    ports:
      - 3000:3000
