services:
  client:
    build:
      context: .
      dockerfile: compose/staging/Dockerfile
    image: staging-marketplace-client
    container_name: staging-marketplace-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file:
      - compose/staging/.env
    networks:
      - staging-marketplace
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

networks:
  staging-marketplace:
    external: true