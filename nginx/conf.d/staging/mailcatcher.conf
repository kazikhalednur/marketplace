# MailCatcher Service Configuration - Staging Environment
# Email testing tool web interface
# Internal Port: 1080 -> NGINX Port: 8448 (HTTPS)

upstream mailcatcher {
    server staging-mailcatcher:1080 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 8448 ssl;
    listen [::]:8448 ssl;
    http2 on;
    server_name cpchub.diu.edu.bd;

    # SSL certificate paths
    ssl_certificate /etc/nginx/ssl/cpchub_diu_edu_bd.crt;
    ssl_certificate_key /etc/nginx/ssl/cpchub_diu_edu_bd.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/mailcatcher_access.log main;
    error_log /var/log/nginx/mailcatcher_error.log warn;

    # Basic auth for staging (optional - uncomment if needed)
    # auth_basic "MailCatcher Staging";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://mailcatcher;
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for live email updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_buffering off;
        proxy_redirect off;
    }
}
