# Server Service Configuration - Staging Environment
# Serves the Django/FastAPI backend API
# Internal Port: 8000 -> NGINX Port: 8443 (HTTPS)

upstream server {
    server staging-marketplace-server:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP redirect for server
server {
    listen 8080;
    server_name cpchub.diu.edu.bd;

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# Main HTTPS server block for backend API
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name cpchub.diu.edu.bd;

    # SSL certificate paths
    ssl_certificate /etc/nginx/ssl/cpchub_diu_edu_bd.crt;
    ssl_certificate_key /etc/nginx/ssl/cpchub_diu_edu_bd.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/server_access.log main;
    error_log /var/log/nginx/server_error.log warn;

    # Increased timeout for long-running API requests
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Root location - proxy to backend server
    location / {
        proxy_pass http://server;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;

        proxy_redirect off;
    }

    # Health check endpoint
    location /health_check/ {
        access_log off;
        proxy_pass http://server;
    }

}
