# Jenkins Service Configuration
# CI/CD automation server
# Internal Port: 8080 (assumed) -> NGINX Port: 8447 (HTTPS)

upstream jenkins {
    # Assumption: Docker service name is "jenkins"
    # Jenkins typically runs on port 8080
    server jenkins:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Jenkins HTTPS Server Block (Port 8447)
server {
    listen 8447 ssl http2;
    listen [::]:8447 ssl http2;
    server_name cpchub.diu.edu.bd;

    # SSL certificate paths
    ssl_certificate /etc/nginx/ssl/cpchub_diu_edu_bd.crt;
    ssl_certificate_key /etc/nginx/ssl/cpchub_diu_edu_bd.key;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/jenkins_access.log main;
    error_log /var/log/nginx/jenkins_error.log warn;

    # Large request body support (for artifact uploads)
    client_max_body_size 500M;

    # Timeouts for long-running Jenkins operations
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://jenkins;

        # Required headers for Jenkins
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Jenkins-specific headers
        proxy_set_header X-Forwarded-Ssl on;

        # WebSocket support (for Jenkins build logs)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Required for Jenkins CLI and JNLP agents
        proxy_buffering off;
        proxy_request_buffering off;

        # Disable proxy redirect
        proxy_redirect http:// https://;
        proxy_redirect default;
    }

    # Jenkins CLI protocol
    location /cli {
        proxy_pass http://jenkins;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    # Static resources
    location ~ ^/(static|assets|images|css|js)/ {
        proxy_pass http://jenkins;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health check (Jenkins monitoring endpoint)
    location /login {
        access_log off;
        proxy_pass http://jenkins;
    }
}
