# MinIO Service Configuration - Local Development
# MinIO S3-compatible object storage
# API Port: 9000 -> NGINX Port: 9000 (HTTP)
# Console Port: 9001 -> NGINX Port: 9001 (HTTP)

upstream minio_api {
    server local-aistor-server:9000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream minio_console {
    server local-aistor-server:9001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# MinIO API (S3-compatible)
server {
    listen 9000;
    server_name localhost marketplace.local;

    # Logging
    access_log /var/log/nginx/minio_api_access.log main;
    error_log /var/log/nginx/minio_api_error.log warn;

    # Large file uploads
    client_max_body_size 1G;
    client_body_timeout 300s;

    # Ignore client abort to prevent partial uploads
    proxy_ignore_client_abort on;

    location / {
        proxy_pass http://minio_api;
        
        # Proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # MinIO-specific headers
        proxy_set_header X-NginX-Proxy true;
        
        # Timeouts for large file operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings for large files
        proxy_buffering off;
        proxy_request_buffering off;
        
        proxy_redirect off;
        
        # WebSocket support for MinIO events
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# MinIO Console (Admin UI)
server {
    listen 9001;
    server_name localhost marketplace.local;

    # Logging
    access_log /var/log/nginx/minio_console_access.log main;
    error_log /var/log/nginx/minio_console_error.log warn;

    location / {
        proxy_pass http://minio_console;
        
        # Proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for console
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_buffering off;
        proxy_redirect off;
    }
}
