# Client Service Configuration - Local Development
# Serves the Next.js frontend application at localhost
# Internal Port: 3000 -> NGINX Port: 80 (HTTP only for local dev)

# NOTE: lazy DNS resolution via the `resolver` directive is configured
# globally in nginx.conf so this file can use `proxy_pass http://$var;`.

# Main HTTP server block (no SSL for local)
server {
    listen 80;
    server_name localhost marketplace.local;

    # Logging
    access_log /var/log/nginx/client_access.log main;
    error_log /var/log/nginx/client_error.log debug;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Root location - proxy to Next.js application
    location / {
        set $client_upstream "local-marketplace-client:3000";
        proxy_pass http://$client_upstream;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for Next.js HMR in development)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for development
        proxy_buffering off;
        proxy_redirect off;
    }

    # Next.js specific paths
    location /_next/static/ {
        set $client_upstream "local-marketplace-client:3000";
        proxy_pass http://$client_upstream;
        # No caching in local dev
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Next.js webpack HMR
    location /_next/webpack-hmr {
        set $client_upstream "local-marketplace-client:3000";
        proxy_pass http://$client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static assets
    location /static/ {
        set $client_upstream "local-marketplace-client:3000";
        proxy_pass http://$client_upstream;
        # No caching in local dev
        add_header Cache-Control "no-cache";
    }
}
