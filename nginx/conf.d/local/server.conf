# Server Service Configuration - Local Development
# Serves the Django/FastAPI backend API at localhost:8000
# Internal Port: 8000 -> NGINX Port: 8000 (HTTP only for local dev)

# NOTE: lazy DNS resolution via the `resolver` directive is configured
# globally in nginx.conf so this file can use `proxy_pass http://$var;`.

# Main HTTP server block for backend API (no SSL for local)
server {
    listen 8000;
    server_name localhost marketplace.local;

    # Logging with debug level for local
    access_log /var/log/nginx/server_access.log main;
    error_log /var/log/nginx/server_error.log debug;

    # Increased timeout for debugging
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Root location - proxy to backend server
    location / {
        set $server_upstream "local-marketplace-server:8000";
        proxy_pass http://$server_upstream;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for Django Channels or similar)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for development
        proxy_buffering off;
        proxy_redirect off;
    }
}
