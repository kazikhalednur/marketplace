# MailCatcher Service Configuration - Local Development
# Email testing tool web interface
# Internal Port: 1080 -> NGINX Port: 1080 (HTTP)

# NOTE: lazy DNS resolution via the `resolver` directive is configured
# globally in nginx.conf so this file can use `proxy_pass http://$var;`.

server {
    listen 1080;
    server_name localhost marketplace.local;

    # Logging
    access_log /var/log/nginx/mailcatcher_access.log main;
    error_log /var/log/nginx/mailcatcher_error.log warn;

    location / {
        set $mailcatcher_upstream "local-mailcatcher:1080";
        proxy_pass http://$mailcatcher_upstream;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for live email updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_redirect off;
    }
}
