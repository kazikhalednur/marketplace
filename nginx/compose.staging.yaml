# Docker Compose configuration for NGINX reverse proxy
# Staging Environment configuration
# 
# This is a symlink/copy of compose.yaml for explicit staging deployment
# Use: docker compose -f compose.staging.yaml up -d

services:
  nginx:
    build:
      context: .
      dockerfile: compose/staging/Dockerfile
    image: staging-marketplace-nginx
    container_name: staging-marketplace-nginx
    restart: unless-stopped
    
    ports:
      # HTTP to HTTPS redirect
      - "80:80"
      # Main client application
      - "443:443"
      # Backend server API
      - "8443:8443"
      # MinIO API
      - "8444:8444"
      # MinIO Console
      - "8445:8445"
      # Jenkins
      - "8447:8447"
      # MailCatcher
      - "8448:8448"
    
    volumes:
      # Mount SSL certificates from host (read-only)
      - ../ssl:/etc/nginx/ssl:ro
      
      # Mount NGINX logs to host for persistence
      - ./logs:/var/log/nginx
    
    networks:
      - staging-marketplace-backend
      - staging-marketplace
      - staging-public
    
    environment:
      # Set timezone
      - TZ=Asia/Dhaka
      - ENVIRONMENT=staging
    
    labels:
      - "com.cpchub.description=NGINX reverse proxy"
      - "com.cpchub.service=nginx"
      - "com.cpchub.environment=staging"
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    security_opt:
      - no-new-privileges:true

networks:
  staging-marketplace-backend:
    external: true
  staging-marketplace:
    external: true
  staging-public:
    external: true
