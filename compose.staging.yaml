services:
  db:
    image: postgres:17
    container_name: marketplace-staging-db
    restart: unless-stopped
    user: postgres
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - private-net
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: marketplace-staging-redis
    restart: unless-stopped
    expose:
      - 6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - private-net
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: sj26/mailcatcher
    container_name: marketplace-staging-mailcatcher
    restart: unless-stopped
    expose:
      - 1025
    networks:
      - private-net
      - public-net
    ports:
      - 1080:1080

  django: &django
    build:
      context: .
      dockerfile: compose/staging/django/Dockerfile
    image: marketplace-staging-server
    container_name: marketplace-staging-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailcatcher:
        condition: service_started
      redis:
        condition: service_started
    secrets:
      - secret-password
      - db-password
      - smtp-password
      - minio-access-key
      - minio-secret-key
    env_file:
      - .env
    environment:
      SECRET_KEY_FILE: /run/secrets/secret-password
      EMAIL_HOST_PASSWORD_FILE: /run/secrets/smtp-password
      DB_PASSWORD_FILE: /run/secrets/db-password
      MINIO_ACCESS_KEY_FILE: /run/secrets/minio-access-key
      MINIO_SECRET_KEY_FILE: /run/secrets/minio-secret-key
      DEBUG: true
      SERVER_TYPE: staging
    volumes:
      - ./src:/app
    networks:
      - private-net
      - public-net
      - s3-net
    ports:
      - 8000:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health_check/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # read_only: true
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true

  celeryworker:
    <<: *django
    container_name: marketplace-staging-celeryworker
    command: /start-celeryworker
    ports: []

volumes:
  db-data:
  redis-data:


secrets:
  secret-password:
    file: secrets/django/secret_key.txt
  smtp-password:
    file: secrets/django/smtp_password.txt
  db-password:
    file: secrets/db/password.txt
  minio-access-key:
    file: secrets/minio/access_key.txt
  minio-secret-key:
    file: secrets/minio/secret_key.txt

networks:
  public-net:
    driver: bridge
  private-net:
    driver: bridge
    internal: true
  s3-net:
    external: true
