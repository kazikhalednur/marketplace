services:
  django: &django
    build:
      context: .
      dockerfile: compose/staging/django/Dockerfile
    image: marketplace-staging-server
    container_name: marketplace-staging-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailcatcher:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DEBUG: true
      SERVER_TYPE: staging
    volumes:
      - ./src:/app
    networks:
      - backend
    ports:
      - 8000:8000
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health_check/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # read_only: true
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true

  celeryworker:
    <<: *django
    container_name: marketplace-staging-celeryworker
    command: /start-celeryworker
    ports: []


networks:
  backend:
    external: true
