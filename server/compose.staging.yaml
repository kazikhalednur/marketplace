services:
  django: &django
    build:
      context: .
      dockerfile: compose/staging/django/Dockerfile
    image: staging-marketplace-server
    container_name: staging-marketplace-server
    restart: unless-stopped
    env_file:
      - compose/staging/.env
    environment:
      DEBUG: true
      SERVER_TYPE: staging
    volumes:
      - ./google_credentials.json:/app/google_credentials.json:ro
    networks:
      - staging-marketplace-database
      - staging-marketplace-backend
      - staging-marketplace
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health_check/')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  celeryworker:
    <<: *django
    container_name: staging-marketplace-celeryworker
    command: /start-celeryworker
    healthcheck:
      test: [ "CMD", "celery", "-A", "config", "inspect", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  staging-marketplace-database:
    external: true
  staging-marketplace-backend:
    external: true
  staging-marketplace:
    external: true
