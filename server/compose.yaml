services:
  django: &django
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
    image: marketplace-server
    container_name: marketplace-server
    user: "${UID}:${GID}"
    env_file:
      - compose/local/.env
    environment:
      DEBUG: true
      SERVER_TYPE: local
      UID: "${UID}"
      GID: "${GID}"
    volumes:
      - ./src:/app
    ports:
      - 8000:8000
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health_check/')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  celeryworker:
    <<: *django
    container_name: marketplace-celeryworker
    command: /start-celeryworker
    ports: []

networks:
  backend:
    external: true
