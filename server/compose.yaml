services:
  django: &django
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
    image: marketplace-server
    container_name: marketplace-server
    user: "${UID}:${GID}"
    env_file:
      - compose/local/.env
    environment:
      DEBUG: true
      SERVER_TYPE: local
    volumes:
      - ./src:/app
    ports:
      - 8000:8000
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health_check/"]
      interval: 10s
      timeout: 5s
      retries: 5

  celeryworker:
    <<: *django
    container_name: marketplace-celeryworker
    command: /start-celeryworker
    ports: []

networks:
  backend:
    external: true
