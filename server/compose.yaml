services:
  django: &django
    build:
      context: .
      dockerfile: compose/local/django/Dockerfile
    image: local-marketplace-server
    container_name: local-marketplace-server
    env_file:
      - compose/local/.env
    environment:
      DEBUG: true
      SERVER_TYPE: local
    volumes:
      - ./src:/app
    ports:
      - 8000:8000
    networks:
      - local-marketplace-database
      - local-marketplace-backend
      - local-marketplace
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health_check/')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  celeryworker:
    <<: *django
    container_name: local-marketplace-celeryworker
    command: /start-celeryworker
    ports: []

networks:
  local-marketplace-database:
    external: true
  local-marketplace-backend:
    external: true
  local-marketplace:
    external: true
