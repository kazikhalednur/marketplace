services:
  mailcatcher:
    image: sj26/mailcatcher
    container_name: local-mailcatcher
    expose:
      - 1025
    ports:
      - 1080:1080
    networks:
      - local-marketplace-backend
      - local-marketplace
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://0.0.0.0:1080" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  local-marketplace-backend:
    external: true
  local-marketplace:
    external: true
