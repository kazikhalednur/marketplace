services:
  aistor-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: local-aistor-server
    container_name: local-aistor-server
    command: minio server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${MINIO_PATH}:/data
      - ${MINIO_LICENSE_PATH}:/minio.license
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - local-marketplace-backend
      - local-marketplace

networks:
  local-marketplace-backend:
    external: true
  local-marketplace:
    external: true
