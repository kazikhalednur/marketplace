services:
  aistor-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aistor-server
    command: minio server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_VOLUMES: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ${HOME}/minio/data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - staging-backend

networks:
  staging-backend:
    external: true
