services:
  aistor-server:
    image: quay.io/minio/aistor/minio:latest
    container_name: aistor-server
    command: minio server
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio:/mnt/minio
    secrets:
      - root_user
      - root_password
    environment:
      MINIO_CONFIG_ENV_FILE: /mnt/minio/config
      MINIO_ROOT_USER_FILE: /run/secrets/root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/root_password
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - s3-net

networks:
  s3-net:
    external: true

secrets:
  root_user:
    file: ./secrets/root_user.txt
  root_password:
    file: ./secrets/root_password.txt